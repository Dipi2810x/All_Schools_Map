<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Western Cape Education Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .legend { background: white; padding: 6px; font-size: 13px; }
    .venue-marker {
      background: transparent;
      border: 0;
    }
    .venue-marker svg {
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
    }
    .think-tank-panel {
      width: 310px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid #999;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
      font: 14px/1.4 Arial, sans-serif;
    }
    .think-tank-panel h2 {
      margin: 0;
      padding: 10px 12px 4px;
      font-size: 16px;
    }
    .think-tank-panel p {
      margin: 0;
      padding: 0 12px 9px;
      color: #555;
    }
    .think-tank-list {
      border-top: 1px solid #ddd;
    }
    .think-tank-button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-bottom: 1px solid #eee;
      background: #fff;
      color: #222;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .think-tank-button:hover,
    .think-tank-button[aria-pressed="true"] {
      background: #f0e5f4;
    }
    .think-tank-button[aria-pressed="true"] {
      box-shadow: inset 3px 0 #7b3294;
    }
    .think-tank-details {
      padding: 10px 12px;
      border-top: 1px solid #ddd;
    }
    @media (max-width: 480px) {
      .think-tank-panel {
        width: min(310px, calc(100vw - 60px));
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    const map = L.map('map').setView([-33.95, 18.6], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // Higher panes are always rendered above lower panes, independent of fetch order.
    ['districts', 'ctDistricts', 'schools', 'expo', 'deVenues', 'seVenues', 'thinkTankHighlight'].forEach((name, index) => {
      map.createPane(name);
      map.getPane(name).style.zIndex = 400 + index * 10;
    });

    const districtsLayer = L.layerGroup().addTo(map);
    const ctDistrictsLayer = L.layerGroup().addTo(map);
    const schoolsLayer = L.layerGroup().addTo(map);
    const expoLayer = L.layerGroup().addTo(map);
    const deVenuesLayer = L.layerGroup().addTo(map);
    const seVenuesLayer = L.layerGroup().addTo(map);
    const thinkTankHighlightsLayer = L.layerGroup().addTo(map);
    let educationDistricts = [];
    L.control.layers(null, {
      '2026 DE venues': deVenuesLayer,
      '2026 SE venues': seVenuesLayer ,
      '2026 Participating Schools': expoLayer,
      'All schools (2018-2025)': schoolsLayer,
      'CT education districts': ctDistrictsLayer,
      'Education districts': districtsLayer
    }, { collapsed: false }).addTo(map);

    const thinkTankOrganisations = [
      {
        name: 'CPUT: South Africa Quantum Technology Initiative (SAQuTI)',
        location: 'Cape Town (CPUT); outreach across all expo regions',
        lat: -33.932, lon: 18.635,
        allExpoRegions: true
      },
      {
        name: 'Inkcubeko Youth Science Centre',
        location: 'George, Eden Karoo',
        lat: -33.963, lon: 22.461,
        regions: ['Eden Karoo']
      },
      {
        name: 'iThemba LABS',
        location: 'Faure',
        lat: -34.035, lon: 18.73,
        regions: ['Cape Town']
      },
      {
        name: 'NRF-SAEON',
        location: 'Cape Town',
        lat: -33.9249, lon: 18.4241,
        regions: ['Cape Town']
      },
      {
        name: 'South African National Space Agency (SANSA)',
        location: 'Hermanus',
        lat: -34.4187, lon: 19.2345,
        regions: ['Cape Winelands']
      },
      {
        name: 'South African Polar Research Infrastructure (SAPRI)',
        location: 'Cape Town',
        lat: -33.9249, lon: 18.4241,
        regions: ['Cape Town']
      },
      {
        name: 'Stellenbosch University (Division of Immunology: SAMRC Centre for TB Research)',
        location: 'Cape Town',
        lat: -33.9249, lon: 18.4241,
        regions: ['Cape Town']
      },
      {
        name: 'Stellenbosch University (Centre for Invasion Biology, School for Climate Studies)',
        location: 'Cape Town',
        lat: -33.9249, lon: 18.4241,
        regions: ['Cape Town']
      },
      {
        name: 'Stellenbosch University (Division of Molecular Biology and Human Genetics)',
        location: 'Cape Town',
        lat: -33.9249, lon: 18.4241,
        regions: ['Cape Town']
      }
    ];

    const thinkTankControl = L.control({ position: 'topleft' });
    thinkTankControl.onAdd = () => {
      const container = L.DomUtil.create('section', 'think-tank-panel');
      container.setAttribute('aria-label', 'Think Tank Organisations');
      const heading = L.DomUtil.create('h2', '', container);
      heading.textContent = 'Think Tank Organisations';
      const instructions = L.DomUtil.create('p', '', container);
      instructions.textContent = 'Select an organisation to show its location and outreach region(s).';
      const list = L.DomUtil.create('div', 'think-tank-list', container);
      const details = L.DomUtil.create('div', 'think-tank-details', container);
      details.hidden = true;
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);

      thinkTankOrganisations.forEach(organisation => {
        const button = L.DomUtil.create('button', 'think-tank-button', list);
        button.type = 'button';
        button.textContent = organisation.name;
        button.setAttribute('aria-pressed', 'false');
        L.DomEvent.on(button, 'click', () => {
          list.querySelectorAll('.think-tank-button').forEach(item =>
            item.setAttribute('aria-pressed', 'false'));
          button.setAttribute('aria-pressed', 'true');
          showThinkTankOrganisation(organisation, details);
        });
      });

      return container;
    };
    thinkTankControl.addTo(map);

    function showThinkTankOrganisation(organisation, details) {
      thinkTankHighlightsLayer.clearLayers();
      const matchingDistricts = organisation.allExpoRegions
        ? educationDistricts
        : educationDistricts.filter(feature =>
          organisation.regions.includes(feature.properties.DISTRICT));
      const districtLayer = L.geoJSON({
        type: 'FeatureCollection',
        features: matchingDistricts
      }, {
        pane: 'thinkTankHighlight',
        style: { color: '#7b3294', weight: 4, fillColor: '#c994d8', fillOpacity: 0.4 }
      });
      thinkTankHighlightsLayer.addLayer(districtLayer);

      const marker = L.circleMarker([organisation.lat, organisation.lon], {
        radius: 9, color: '#fff', weight: 3, fillColor: '#7b3294', fillOpacity: 1,
        pane: 'thinkTankHighlight'
      }).bindPopup(`<b>${organisation.name}</b><br/>${organisation.location}`);
      thinkTankHighlightsLayer.addLayer(marker);

      const regionNames = matchingDistricts.map(feature => feature.properties.DISTRICT);
      details.replaceChildren();
      const name = L.DomUtil.create('strong', '', details);
      name.textContent = organisation.name;
      const location = L.DomUtil.create('div', '', details);
      location.textContent = `Location: ${organisation.location}`;
      const coverage = L.DomUtil.create('div', '', details);
      coverage.textContent = `Highlighted region${regionNames.length === 1 ? '' : 's'}: ${
        regionNames.length ? regionNames.join(', ') : 'No matching mapped district'
      }`;
      details.hidden = false;

      const focus = L.featureGroup([districtLayer, marker]);
      if (focus.getBounds().isValid()) {
        map.fitBounds(focus.getBounds(), { padding: [30, 30], maxZoom: 12 });
      }
      marker.openPopup();
    }

    function parseCoord(value) {
      if (value === undefined || value === null) return null;
      const number = parseFloat(String(value).trim().replace(',', '.'));
      return Number.isFinite(number) ? number : null;
    }

    function propertiesToHtml(properties) {
      return Object.entries(properties || {})
        .filter(([, value]) => value !== null && value !== undefined && String(value).trim() !== '')
        .map(([key, value]) => `<b>${key}:</b> ${value}<br/>`).join('');
    }

    function addPoint(layer, lat, lon, properties, color, pane) {
      if (lat === null || lon === null) return null;
      const marker = L.circleMarker([lat, lon], {
        radius: 5, color, fill: true, fillOpacity: 0.9, pane
      }).bindPopup(propertiesToHtml(properties));
      layer.addLayer(marker);
      return marker;
    }

    function addVenuePoint(layer, lat, lon, properties, color, pane) {
      if (lat === null || lon === null) return null;
      const icon = L.divIcon({
        className: 'venue-marker',
        iconSize: [30, 36],
        iconAnchor: [15, 36],
        popupAnchor: [0, -32],
        html: `<svg width="30" height="36" viewBox="0 0 30 36" aria-label="School venue">
          <path d="M15 35C15 35 4 22.8 4 14.5C4 8.4 8.9 3.5 15 3.5S26 8.4 26 14.5C26 22.8 15 35 15 35Z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
          <path d="M9 13.5h12v9H9zM8 13.5l7-4 7 4M12 16v6M18 16v6M14 22v-4h2v4" fill="#fff" stroke="${color}" stroke-width="1"/>
        </svg>`
      });
      const marker = L.marker([lat, lon], { icon, pane }).bindPopup(propertiesToHtml(properties));
      layer.addLayer(marker);
      return marker;
    }

    async function loadGeoJson(file, layer, style, pane) {
      const response = await fetch(file);
      if (!response.ok) throw new Error(`${file}: ${response.status}`);
      const geoJson = await response.json();
      if (file === 'Education_Districts_wgs84.geojson') {
        educationDistricts = geoJson.features;
      }
      L.geoJSON(geoJson, {
        pane,
        style,
        onEachFeature: (feature, subLayer) =>
          subLayer.bindPopup(propertiesToHtml(feature.properties))
      }).eachLayer(subLayer => layer.addLayer(subLayer));
      return geoJson;
    }

    function coordinateColumns(row) {
      let lat = null;
      let lon = null;
      Object.keys(row).forEach(key => {
        const normalized = key.trim().toLowerCase();
        if (lon === null && /^(x|longitude|lon|x_coordinate|x-coordinate)$/.test(normalized)) {
          lon = parseCoord(row[key]);
        }
        if (lat === null && /^(y|latitude|lat|y_coordinate|y-coordinate)$/.test(normalized)) {
          lat = parseCoord(row[key]);
        }
      });
      return { lat, lon };
    }

    async function loadSchools() {
      const response = await fetch('2018_2025_Summary.xlsx');
      if (!response.ok) throw new Error(`2018_2025_Summary.xlsx: ${response.status}`);
      const workbook = XLSX.read(await response.arrayBuffer(), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
      rows.forEach(row => {
        const { lat, lon } = coordinateColumns(row);
        addPoint(schoolsLayer, lat, lon, row, '#1f78b4', 'schools');
      });
    }

    async function loadExpoPoints() {
      const response = await fetch('2026_Dexpo.csv');
      if (!response.ok) throw new Error(`2026_Dexpo.csv: ${response.status}`);
      const text = await response.text();
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, delimiter: ';' });
      parsed.data.forEach(row => {
        const { lat, lon } = coordinateColumns(row);
        addPoint(expoLayer, lat, lon, row, '#e31a1c', 'expo');
      });
    }

    async function loadVenuePoints(file, layer, color, pane) {
      const response = await fetch(file);
      if (!response.ok) throw new Error(`${file}: ${response.status}`);
      const text = await response.text();
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, delimiter: ';' });
      parsed.data.forEach(row => {
        const { lat, lon } = coordinateColumns(row);
        addVenuePoint(layer, lat, lon, row, color, pane);
      });
    }

    async function loadMapData() {
      let districts;
      try {
        districts = await loadGeoJson('Education_Districts_wgs84.geojson', districtsLayer,
          { color: '#245a9c', weight: 1.5, fillColor: '#74a9cf', fillOpacity: 0.2 }, 'districts');
      } catch (error) {
        console.error('Education districts could not be loaded:', error);
      }
      try {
        await loadGeoJson('CT_Education_Districts_wgs84.geojson', ctDistrictsLayer,
          { color: '#8c510a', weight: 2, fillColor: '#d8b365', fillOpacity: 0.25 }, 'ctDistricts');
      } catch (error) {
        console.error('CT education districts could not be loaded:', error);
      }
      try {
        await loadSchools();
      } catch (error) {
        console.error('All schools could not be loaded:', error);
      }
      try {
        await loadExpoPoints();
      } catch (error) {
        console.error('2026 expo points could not be loaded:', error);
      }
      try {
        await loadVenuePoints('2026_DE_Venues.csv', deVenuesLayer, '#7b3294', 'deVenues');
      } catch (error) {
        console.error('2026 DE venues could not be loaded:', error);
      }
      try {
        await loadVenuePoints('2026_SE_Venues.csv', seVenuesLayer, '#008837', 'seVenues');
      } catch (error) {
        console.error('2026 SE venues could not be loaded:', error);
      }

      const visibleLayers = schoolsLayer.getLayers()
        .concat(expoLayer.getLayers(), deVenuesLayer.getLayers(), seVenuesLayer.getLayers());
      if (visibleLayers.length) {
        map.fitBounds(L.featureGroup(visibleLayers).getBounds(), { padding: [20, 20], maxZoom: 15 });
      } else if (districts && districts.features.length) {
        const districtLayer = L.geoJSON(districts);
        map.fitBounds(districtLayer.getBounds(), { padding: [20, 20], maxZoom: 10 });
      }
    }

    loadMapData();
  </script>
</body>
</html>
